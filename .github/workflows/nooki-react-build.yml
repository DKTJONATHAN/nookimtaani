name: Nooki React build and deploy
on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/nooki-react-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/nooki-react-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Validate Worker configuration (pull requests only)
        if: github.event_name == 'pull_request'
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Deploy Worker and website to Cloudflare (main branch only)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
